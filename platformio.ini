; LoRa Ra-02 range test.
; Two-way (ping-pong), both boards with OLED + buzzer:
;   pio run -e nodeA -t upload   # node A, sends PINGs
;   pio run -e nodeB -t upload   # node B, answers with PONGs
; Original one-way test:
;   pio run -e tx -t upload      # transmitter Nano
;   pio run -e rx -t upload      # receiver Nano (with OLED)
;   pio device monitor           # 115200 baud
;
; Most clone Nanos use the old bootloader (57600 baud upload) = nanoatmega328.
; If upload fails with "not in sync", switch board to nanoatmega328new.

[platformio]
default_envs = nodeA

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; upload_port = COM5

[env:tx]
build_src_filter = +<tx/>
lib_deps =
    sandeepmistry/LoRa@^0.8.0

[env:rx]
build_src_filter = +<rx/>
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    olikraus/U8g2@^2.35.9

[env:nodeA]
build_src_filter = +<node/>
build_flags = -D NODE_MASTER=1
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    olikraus/U8g2@^2.35.9

[env:nodeB]
build_src_filter = +<node/>
build_flags = -D NODE_MASTER=0
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    olikraus/U8g2@^2.35.9
