; LoRa Ra-02 range test.
; Two-way (ping-pong), both boards with OLED + buzzer:
;   pio run -e nodeA -t upload   # node A, sends PINGs
;   pio run -e nodeB -t upload   # node B, answers with PONGs
; Heltec WiFi LoRa 32 V2 (433 MHz version), same two-way test:
;   pio run -e heltecA -t upload  # node A, sends PINGs
;   pio run -e heltecB -t upload  # node B, answers with PONGs
; Original one-way test:
;   pio run -e tx -t upload      # transmitter Nano
;   pio run -e rx -t upload      # receiver Nano (with OLED)
;   pio device monitor           # 115200 baud
;
; Most clone Nanos use the old bootloader (57600 baud upload) = nanoatmega328.
; If upload fails with "not in sync", switch board to nanoatmega328new.

[platformio]
default_envs = nodeA

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; upload_port = COM5

[env:tx]
build_src_filter = +<tx/>
lib_deps =
    sandeepmistry/LoRa@^0.8.0

[env:rx]
build_src_filter = +<rx/>
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    olikraus/U8g2@^2.35.9

[env:nodeA]
build_src_filter = +<node/>
build_flags = -D NODE_MASTER=1
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    olikraus/U8g2@^2.35.9

[env:nodeB]
build_src_filter = +<node/>
build_flags = -D NODE_MASTER=0
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    olikraus/U8g2@^2.35.9

; ---- Heltec WiFi LoRa 32 V2 (ESP32 + SX1276 + OLED on one board) ----------
; Use the 433 MHz board with a 433 MHz antenna. Lower LORA_TX_POWER to your
; country's legal limit (EU 433 MHz: 10 dBm).
[heltec_base]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
build_src_filter = +<node/>
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    olikraus/U8g2@^2.35.9

[env:heltecA]
extends = heltec_base
build_flags = -D HELTEC_V2=1 -D NODE_MASTER=1

[env:heltecB]
extends = heltec_base
build_flags = -D HELTEC_V2=1 -D NODE_MASTER=0

; Ground node: WiFi hotspot + web page for the phone, listens to the mast.
;   pio run -e heltecGround -t upload
; Keep its TX power low: it is next to the mast.
[env:heltecGround]
extends = heltec_base
build_src_filter = +<ground/>
build_flags = -D HELTEC_V2=1 -D LORA_TX_POWER=2
